<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fluentify</title>
  <style>
    :root {
      --green: #06C755;
      --green-dark: #05A847;
      --green-text: #047A36;
      --chat-bg: #8FAAD3;
      --bubble-other: #FFFFFF;
      --text: #111111;
      --muted: #6B7280;
      --line: #E5E7EB;
      --danger: #D93025;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      width: 380px;
      margin: 0;
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
      background: #FFFFFF;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--green-dark);
      outline-offset: 2px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 8px 0 14px;
      color: #FFFFFF;
      background: var(--green);
    }
    .header h1 {
      flex: 1;
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      color: inherit;
      background: transparent;
      border: none;
      border-radius: 50%;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Composer */
    .composer { padding: 10px 10px 0; }
    .composer textarea {
      display: block;
      width: 100%;
      min-height: 68px;
      max-height: 160px;
      padding: 10px 14px;
      font: inherit;
      resize: none;
      background: #F3F4F6;
      border: 1px solid transparent;
      border-radius: 16px;
    }
    .composer textarea:focus { background: #FFFFFF; border-color: var(--green); outline: none; }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px 0;
    }

    /* Tone chips */
    .tones {
      display: flex;
      flex: 1;
      gap: 6px;
      min-width: 0;
    }
    .tone {
      flex: 1;
      padding: 5px 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .tone:hover { border-color: var(--green); }
    .tone:disabled { cursor: default; opacity: 0.6; }
    .tone[aria-checked="true"] {
      color: #FFFFFF;
      font-weight: 600;
      background: var(--green);
      border-color: var(--green);
    }
    .send {
      flex: none;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      color: #FFFFFF;
      background: var(--green);
      border: none;
      border-radius: 50%;
    }
    .send:hover { background: var(--green-dark); }
    .send:disabled { background: #C8CDD3; cursor: default; }
    .send svg { width: 20px; height: 20px; fill: currentColor; }
    .hint {
      margin: 0;
      padding: 4px 14px 8px;
      color: var(--muted);
      font-size: 11px;
    }

    /* Result area */
    .chat {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 150px;
      max-height: 300px;
      padding: 12px 10px;
      overflow-y: auto;
      background: var(--chat-bg);
    }
    .system {
      align-self: center;
      max-width: 90%;
      padding: 3px 12px;
      color: #FFFFFF;
      font-size: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 999px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bubble-other);
      border-radius: 16px;
    }
    .card.error { color: var(--danger); background: #FDECEA; }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tone-tag { color: var(--green-text); font-size: 12px; font-weight: 700; }
    .toggle {
      padding: 2px 10px;
      color: var(--muted);
      font-size: 11px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .toggle[aria-pressed="true"] {
      color: var(--green-text);
      font-weight: 600;
      background: #D9F7E3;
      border-color: transparent;
    }
    .result {
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .result mark {
      padding: 0 1px;
      color: inherit;
      font-weight: 600;
      background: #D9F7E3;
      border-radius: 3px;
    }
    .result del { color: #B4483F; text-decoration: line-through; }
    .card .note { margin: 0; color: var(--muted); font-size: 12px; }
    .card .primary { margin-top: 0; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing i {
      width: 6px;
      height: 6px;
      background: #9CA3AF;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typing i { animation: none; }
    }

    /* Settings */
    .settings {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 16px 14px;
    }
    .settings label { margin-top: 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .settings input, .settings select {
      width: 100%;
      padding: 9px 12px;
      font: inherit;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .settings input:focus, .settings select:focus { border-color: var(--green); outline: none; }
    .settings .note { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .primary {
      margin-top: 12px;
      padding: 10px;
      color: #FFFFFF;
      font-weight: 700;
      background: var(--green);
      border: none;
      border-radius: 10px;
    }
    .primary:hover { background: var(--green-dark); }
    .status { min-height: 18px; font-size: 12px; }
    .status.ok { color: var(--green-dark); }
    .status.bad { color: var(--danger); }
  </style>
</head>
<body>
  <header class="header">
    <button id="backButton" class="icon-btn" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </button>
    <h1 id="title">Fluentify</h1>
    <button id="showSettings" class="icon-btn" type="button" aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </header>

  <main id="apiKeyContainer" class="settings" hidden>
    <label for="apiKey">OpenAI API key</label>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
    <p class="note">Stored on this device only. Sent only to api.openai.com.</p>
    <label for="openaiModel">Model</label>
    <input type="text" id="openaiModel" placeholder="e.g. gpt-5.2" autocomplete="off">
    <label for="reasoningEffort">Reasoning effort</label>
    <select id="reasoningEffort"></select>
    <p class="note">Higher is slower and costs more. Ignored if the model does not support it.</p>
    <button id="saveApiKey" class="primary" type="button">Save</button>
    <div id="apiKeyStatus" class="status" role="status"></div>
  </main>

  <main id="refineContainer" hidden>
    <div class="composer">
      <textarea id="inputText" rows="3" placeholder="Type an English sentence" aria-label="English sentence to enhance"></textarea>
    </div>
    <div class="controls">
      <div id="tones" class="tones" role="radiogroup" aria-label="Tone"></div>
      <button id="refineButton" class="send" type="button" aria-label="Enhance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5v-6.8L14 12 3 10.3V3.5L22 12z"/></svg>
      </button>
    </div>
    <p class="hint">Ctrl/⌘ + Enter to send</p>
    <div id="chat" class="chat" aria-live="polite"></div>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
